<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nayeeb Rahman: product manager, business analyst and growth consultant based in Dhaka. 8 years across product, BA and research.">

<meta property="og:title" content="Nayeeb Rahman">
<meta property="og:description" content="Product manager, business analyst and growth consultant based in Dhaka.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700&family=Noto+Serif+JP:wght@700;900&display=swap">
<style>
/* Layout concept: one night-lit anime world. Full-bleed scenes from the hero video,
   left-weighted type, sharp chamfered frames, ember as the only accent. */
:root{
  --void:#07080C; --ink:#0E0F14; --char:#17110D; --raise:#14151B;
  --bone:#F2EEE8; --ash:#A9A39B; --smoke:#6B665F; --dim:#938D85; --line:rgba(242,238,232,.12); --line-strong:rgba(242,238,232,.24);
  --ember:#FA7402; --amber:#FCA03A; --ember-ink:#1A0B02;
  --cat-growth:#FA7402; --cat-product:#6E9BF5; --cat-transformation:#B183EE; --cat-ventures:#2CC9BF;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-brush:cubic-bezier(.65,0,.35,1);
  --gut:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
  --wrap:1280px; --nav-h:68px;
  --chamfer:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--void);color:var(--bone);font:400 17px/1.65 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--void)}
::selection{background:var(--ember);color:var(--ember-ink)}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
html{scrollbar-color:var(--smoke) var(--void)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.005em;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
@media (min-width:768px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
@media (min-width:1200px){.wrap{padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}}
.sec{padding-block:clamp(88px,12vw,168px);position:relative}
.ico{width:1.15em;height:1.15em;fill:currentColor;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type ---------- */
.d-xl{font-size:clamp(4rem,12.5vw,9.6rem);line-height:.86}
.d-l{font-size:clamp(3rem,8vw,6rem);line-height:.9}
.h2{font-size:clamp(2.4rem,5.4vw,4.4rem);line-height:.94}
.h3{font-size:clamp(1.5rem,2.4vw,2rem);line-height:1}
.lede{font-size:clamp(1.08rem,1.5vw,1.28rem);line-height:1.6;color:var(--ash);max-width:56ch}
.body-copy{color:var(--ash);max-width:62ch}
.body-copy strong,.lede strong{color:var(--bone);font-weight:600}
.accent{color:var(--ember);display:inline-block;transform:skewX(-9deg);filter:url(#rough);padding-right:.06em}
.kanji-tag{font-family:var(--jp);font-weight:700;color:var(--ember);font-size:.95rem;letter-spacing:.08em}
.mono{font-family:var(--mono);font-weight:500;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:.6em;font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding:.55em .9em;border:1px solid rgba(250,116,2,.35);background:rgba(250,116,2,.07)}
.badge i{width:7px;height:7px;background:var(--ember);display:block;box-shadow:0 0 0 0 rgba(250,116,2,.6);animation:live 2.4s var(--ease-out) infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(250,116,2,.55)}70%,100%{box-shadow:0 0 0 9px rgba(250,116,2,0)}}

/* placeholders the owner must fill */
.tbd{color:var(--amber);border-bottom:1px dashed rgba(252,160,58,.6);font-style:normal}
.tbd::before{content:"To add: ";font-family:var(--mono);font-size:.72em;letter-spacing:.08em;text-transform:uppercase;opacity:.8}

/* ---------- buttons ---------- */
.btn{--bg:transparent;--fg:var(--bone);position:relative;display:inline-flex;align-items:center;gap:.7em;white-space:nowrap;
  font:700 .8rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--fg);background:var(--bg);
  padding:1.15em 1.5em;border:0;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  transition:transform 160ms var(--ease-out),background-color 180ms ease,color 180ms ease}
.btn:active{transform:scale(.97)}
.btn-primary{--bg:var(--ember);--fg:var(--ember-ink)}
.btn-ghost{box-shadow:inset 0 0 0 1px var(--line-strong)}
.btn .ico{transition:transform 220ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{--bg:var(--amber)}
  .btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--ember);--fg:var(--amber)}
  .btn:hover .ico{transform:translateX(4px)}
}
.link{display:inline-flex;align-items:center;gap:.5em;color:var(--amber);text-decoration:none;font-weight:600;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size 300ms var(--ease-out);padding-bottom:2px}
@media (hover:hover) and (pointer:fine){.link:hover{background-size:100% 1px}}

/* ---------- frame (HUD card) ---------- */
.frame{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));clip-path:var(--chamfer)}
.frame::before{content:"";position:absolute;inset:0;clip-path:var(--chamfer);padding:1px;background:var(--line);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:background-color 220ms ease}
.corner{position:absolute;width:18px;height:18px;pointer-events:none;transition:transform 260ms var(--ease-out)}
.corner.tl{top:8px;left:8px;border-top:1px solid var(--ember);border-left:1px solid var(--ember)}
.corner.br{bottom:8px;right:8px;border-bottom:1px solid var(--ember);border-right:1px solid var(--ember)}
@media (hover:hover) and (pointer:fine){
  .ignite:hover::before{background:rgba(250,116,2,.55)}
  .ignite:hover .corner.tl{transform:translate(-4px,-4px)}
  .ignite:hover .corner.br{transform:translate(4px,4px)}
}

/* ---------- nav ---------- */
.nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;height:var(--nav-h);transition:transform 320ms var(--ease-out),background-color 240ms ease,backdrop-filter 240ms ease}
.nav.solid{background:rgba(7,8,12,.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 var(--line)}
.nav.hide{transform:translateY(-110%)}
.nav .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.04em}
.brand span{font-family:var(--jp);font-size:.72rem;color:var(--ember);letter-spacing:.06em}
.nav-links{display:none;align-items:center;gap:30px;list-style:none;margin:0;padding:0}
.nav-links a{position:relative;text-decoration:none;font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);padding:6px 0;transition:color 180ms ease}
.nav-links a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--ember);transform:scaleX(0);transform-origin:left;transition:transform 320ms var(--ease-out)}
.nav-links a[aria-current="page"]{color:var(--bone)}
.nav-links a[aria-current="page"]::after{transform:scaleX(1)}
@media (hover:hover) and (pointer:fine){.nav-links a:hover{color:var(--bone)}}
.nav-cta{display:none}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;background:none;border:1px solid var(--line-strong);color:var(--bone);cursor:pointer}
.menu-btn .ico{width:22px;height:22px}
@media (min-width:1000px){.nav-links,.nav-cta{display:flex}.menu-btn{display:none}}
.sheet{position:fixed;inset:0;z-index:55;background:var(--void);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut-r) 32px var(--gut);clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path 420ms var(--ease-io),visibility 0s 420ms}
.sheet.open{clip-path:inset(0 0 0 0);visibility:visible;transition:clip-path 480ms var(--ease-io),visibility 0s}
.sheet-top{display:flex;justify-content:space-between;align-items:center;height:52px}
.sheet ul{list-style:none;margin:auto 0;padding:0;display:grid;gap:6px}
.sheet li{opacity:0;transform:translateY(16px);transition:opacity 300ms ease,transform 400ms var(--ease-out)}
.sheet.open li{opacity:1;transform:none}
.sheet.open li:nth-child(2){transition-delay:40ms}.sheet.open li:nth-child(3){transition-delay:80ms}.sheet.open li:nth-child(4){transition-delay:120ms}.sheet.open li:nth-child(5){transition-delay:160ms}.sheet.open li:nth-child(6){transition-delay:200ms}
.sheet a{display:flex;justify-content:space-between;align-items:baseline;text-decoration:none;font-family:var(--display);font-size:clamp(2.6rem,12vw,4rem);text-transform:uppercase;line-height:1.08}
.sheet a small{font-family:var(--jp);font-size:1rem;color:var(--ember)}

/* ---------- page transition ---------- */
.wipe{position:fixed;inset:0;z-index:70;pointer-events:none;display:grid;place-items:center;visibility:hidden}
.wipe-panel{position:absolute;inset:-10% -30%;background:linear-gradient(100deg,var(--amber),var(--ember) 45%,#C2410C);transform:translateX(-115%) skewX(-14deg)}
.wipe-label{position:relative;display:grid;justify-items:center;gap:10px;color:var(--ember-ink);opacity:0}
.wipe-label .k{font-family:var(--jp);font-weight:900;font-size:clamp(3.4rem,10vw,6rem);line-height:1}
.wipe-label .n{font-family:var(--mono);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.8rem}

/* ---------- pages ---------- */
.page{min-height:100dvh}
.page-hero{position:relative;padding-top:calc(var(--nav-h) + clamp(48px,8vw,96px));padding-bottom:clamp(56px,8vw,96px);overflow:hidden}
.watermark{position:absolute;right:max(16px,4vw);top:calc(var(--nav-h) + 8px);font-family:var(--jp);font-weight:900;font-size:clamp(7rem,20vw,17rem);line-height:1;color:var(--bone);opacity:.045;pointer-events:none;user-select:none;white-space:nowrap}
.eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.eyebrow .mono{color:var(--amber)}
.eyebrow::after{content:"";height:1px;width:56px;background:rgba(250,116,2,.5)}

/* reveal: words uncover left to right like a brush pass */
.rv{display:block;overflow:hidden;padding-bottom:.04em}
.rv>span{display:inline-block}
.js .rv>span{clip-path:inset(-10% 100% -10% 0)}
.js .rv.in>span{clip-path:inset(-10% -6% -10% 0);transition:clip-path 720ms var(--ease-out)}
.js .rv.now>span{transition:none}

/* ---------- HOME: hero ---------- */
.hero{position:relative;height:260vh}
.hero-stick{position:sticky;top:0;height:100dvh;min-height:560px;overflow:hidden;background:var(--char)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-shade{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(7,8,12,.7) 0%,rgba(7,8,12,0) 16%),
  linear-gradient(90deg,rgba(7,8,12,.92) 0%,rgba(7,8,12,.7) 30%,rgba(7,8,12,0) 58%),
  linear-gradient(0deg,rgba(7,8,12,.95) 0%,rgba(7,8,12,0) 34%)}
.hero-flash{position:absolute;inset:0;background:radial-gradient(60% 60% at 62% 45%,rgba(252,160,58,.55),rgba(250,116,2,0) 70%);opacity:0;mix-blend-mode:screen;pointer-events:none}
.hero-copy{position:absolute;inset:0;display:flex;align-items:flex-end;padding-bottom:clamp(28px,6vh,72px)}
.hero-copy .wrap{width:100%}
.hero-copy .inner{max-width:640px;display:grid;gap:22px}
.hero h1 .l1{color:var(--bone)}
.hero .role{font-size:clamp(1.05rem,1.6vw,1.3rem);color:var(--bone);max-width:34ch;line-height:1.5}
.hero .role span{color:var(--ash)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
@media (max-width:767px){
  .hero-shade{background:linear-gradient(180deg,rgba(7,8,12,.65) 0%,rgba(7,8,12,0) 14%),linear-gradient(0deg,rgba(7,8,12,.97) 0%,rgba(7,8,12,.86) 38%,rgba(7,8,12,.1) 66%,rgba(7,8,12,.35) 100%)}
  .hero .ctas .btn{flex:1 1 auto;justify-content:center}
}

/* ---------- HOME: doors ---------- */
.doors-head{display:grid;gap:20px;max-width:760px;margin-bottom:clamp(40px,6vw,72px)}
.doors{display:grid;gap:16px}
@media (min-width:900px){.doors{grid-template-columns:1.25fr 1fr 1fr;align-items:end}}
.door{display:grid;grid-template-rows:auto 1fr;text-decoration:none;min-height:420px;overflow:hidden}
.door:nth-child(1){min-height:540px}
.door-img{position:relative;height:100%;min-height:220px;overflow:hidden}
.door-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 600ms var(--ease-out),filter 300ms ease;filter:saturate(.85) brightness(.75)}
.door-img::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--ink) 2%,rgba(14,15,20,0) 60%)}
.door-img .k{position:absolute;z-index:1;top:18px;right:20px;font-family:var(--jp);font-weight:900;font-size:2.4rem;color:var(--bone);opacity:.9}
.door-body{display:grid;gap:12px;padding:24px 26px 28px;background:var(--ink)}
.door-body .q{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.door-body p{color:var(--ash);font-size:.98rem}
.door-body .go{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase}
.door-body .go .ico{transition:transform 260ms var(--ease-out)}
@media (hover:hover) and (pointer:fine){
  .door:hover .door-img img{transform:scale(1.1);filter:saturate(1) brightness(.9)}
  .door:hover .go .ico{transform:translateX(6px)}
}

/* ---------- HOME: proof ---------- */
.proof{border-block:1px solid var(--line);background:linear-gradient(180deg,var(--char),var(--void))}
.proof .wrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 24px;padding-block:clamp(48px,7vw,80px)}
@media (min-width:900px){.proof .wrap{grid-template-columns:1.6fr repeat(3,1fr)}}
.stat .num{font-family:var(--display);font-size:clamp(3rem,6.4vw,5.4rem);line-height:.9;font-variant-numeric:tabular-nums;color:var(--bone)}
.stat .num em{font-style:normal;color:var(--ember)}
.stat p{margin-top:12px;color:var(--ash);font-size:.92rem;max-width:26ch}
.stat.lead{grid-column:1/-1}
@media (min-width:900px){.stat.lead{grid-column:auto}}

/* ---------- HOME: featured work (horizontal pan) ---------- */
.pan-intro{display:grid;gap:18px;margin-bottom:40px}
.pan{position:relative}
.pan-track{display:grid;gap:18px}
@media (max-width:999px){.pan-track{padding-left:var(--gut);padding-right:var(--gut-r)}.pan-track .pan-intro.wrap{padding:0}}
@media (min-width:1000px){
  .pan{height:100dvh;overflow:hidden;display:flex;align-items:center}
  .pan-track{display:flex;gap:28px;padding-left:max(64px,calc((100vw - var(--wrap))/2 + 64px));padding-right:64px;will-change:transform}
  .pan-track .case-card{width:min(62vw,820px);flex:none}
  .pan-track .pan-intro{width:min(30vw,380px);flex:none;margin:0;align-self:center}
}
.case-card{display:grid;text-decoration:none;overflow:hidden;background:var(--ink)}
.case-card .media{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--char)}
.case-card .media::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,8,12,.88) 0%,rgba(7,8,12,.35) 45%,rgba(7,8,12,0) 70%)}
.case-card .media .big{z-index:1}
.case-card .media img{width:100%;height:100%;object-fit:cover;transition:transform 600ms var(--ease-out);filter:brightness(.7) saturate(.9)}
.case-card .media .big{position:absolute;left:24px;bottom:18px;font-family:var(--display);font-size:clamp(3rem,7vw,5.6rem);line-height:.9;color:var(--bone)}
.case-card .media .big small{display:block;font-family:var(--body);font-size:.92rem;color:var(--bone);opacity:.85;margin-top:6px;max-width:30ch;line-height:1.4}
.case-card .meta{display:grid;gap:8px;padding:22px 24px 26px}
.case-card .cat{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ash)}
.case-card .cat::before{content:"";width:16px;height:2px;background:var(--c,var(--ember))}
.case-card h3{font-size:clamp(1.6rem,2.6vw,2.2rem)}
.case-card .role{color:var(--ash);font-size:.95rem}
@media (hover:hover) and (pointer:fine){.case-card:hover .media img{transform:scale(1.05)}}

/* ---------- HOME: what I do (rows) ---------- */
.rows{border-top:1px solid var(--line)}
.row{display:grid;gap:14px;padding-block:28px;border-bottom:1px solid var(--line);text-decoration:none}
@media (min-width:900px){.row{grid-template-columns:120px 1.2fr 1fr auto;align-items:center;gap:32px;padding-block:36px}}
.row .k{font-family:var(--jp);font-weight:900;font-size:2.2rem;color:var(--smoke);transition:color 240ms ease}
.row h3{font-size:clamp(2rem,4.4vw,3.6rem);transition:transform 360ms var(--ease-out)}
.row p{color:var(--ash);font-size:.98rem}
.row .ico{width:28px;height:28px;color:var(--smoke);transition:transform 300ms var(--ease-out),color 200ms ease}
@media (hover:hover) and (pointer:fine){
  .row:hover .k{color:var(--ember)} .row:hover h3{transform:translateX(10px)} .row:hover .ico{color:var(--ember);transform:rotate(-45deg)}
}

/* ---------- marquee ---------- */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:30px;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marquee-track{display:flex;gap:56px;width:max-content;animation:marq 38s linear infinite}
.marquee span{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.6rem);text-transform:uppercase;color:transparent;-webkit-text-stroke:1px rgba(242,238,232,.35);white-space:nowrap}
.marquee span.on{color:var(--bone);-webkit-text-stroke:0}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- closing CTA ---------- */
.close{position:relative;overflow:hidden;min-height:78vh;display:flex;align-items:flex-end}
.close img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 30%;filter:brightness(.55)}
.close::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--void) 4%,rgba(7,8,12,.55) 50%,rgba(7,8,12,.25))}
.close .wrap{position:relative;z-index:1;display:grid;gap:26px;padding-block:96px;width:100%}
.close canvas{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);background:var(--void)}
footer .wrap{display:grid;gap:40px;padding-block:64px 40px}
@media (min-width:900px){footer .wrap{grid-template-columns:1.2fr .8fr 1.3fr .9fr}}
.fc-wa{display:inline-flex;align-items:center;gap:10px;color:var(--ash)}
.foot-contact a{overflow-wrap:anywhere}
.direct .item a.dl{color:var(--bone);text-decoration:none;border-bottom:1px solid rgba(250,116,2,.35);transition:border-color 180ms ease,color 180ms ease}
@media (hover:hover) and (pointer:fine){.direct .item a.dl:hover{color:var(--amber);border-color:var(--amber)}}
